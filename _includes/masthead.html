{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">
              <span class="lang-fr">Kai-Ming CHAU</span>
              <span class="lang-en">Kai-Ming CHAU</span>
            </a>
          </li>
          
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <!-- <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}"> -->
            <li class="masthead__menu-item {% if page.url == link.url %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">
                <span class="lang-fr">{{ link.title_fr }}</span>
                <span class="lang-en">{{ link.title_en }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
        
        <ul class="hidden-links hidden"></ul>
        
        <div style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 10;">
          <span id="lang-toggle" style="cursor: pointer; font-weight: bold; padding: 4px 10px; border: 1px solid currentColor; border-radius: 4px; user-select: none;">
            FR
          </span>
        </div>

      </nav>
    </div>
  </div>
</div>
