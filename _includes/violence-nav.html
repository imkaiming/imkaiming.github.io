<!-- BOUTON RETOUR EN HAUT -->
<button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" id="scrollTopBtnViolence" title="Retour en haut">↑</button>

<style>
  #scrollTopBtnViolence {
    display: none; /* Caché par défaut */
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 99;
    font-size: 24px;
    width: 50px;
    height: 50px;
    background-color: #252a34; /* Fond theme Air Dark */
    color: #00adb5; /* Cyan */
    border: 1px solid #00adb5;
    border-radius: 50%; /* Bouton rond */
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  #scrollTopBtnViolence:hover {
    background-color: #00adb5; /* Devient tout cyan au survol */
    color: #252a34;
    transform: translateY(-3px); /* Petit effet de rebond */
  }
</style>

<script>
  // Affiche le bouton quand on scrolle de plus de 300 pixels vers le bas
  window.addEventListener('scroll', function() {
    var btn = document.getElementById("scrollTopBtnViolence");
    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
      btn.style.display = "block";
    } else {
      btn.style.display = "none";
    }
  });
</script>
